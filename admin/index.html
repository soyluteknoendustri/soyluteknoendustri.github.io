<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Giriş — Soylu Tekno &amp; Endüstri</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="admin-body">

  <div class="admin-login-wrap">
    <form class="admin-login-card" id="loginForm">
      <img src="../logo.png" alt="Logo" />
      <h1>Admin Girişi</h1>
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" required />
      </div>
      <button type="submit" class="btn-primary full">Giriş Yap</button>
      <div class="admin-error" id="loginError"></div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorEl = document.getElementById("loginError");
      errorEl.textContent = "";

      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = "Giriş başarısız: e-posta veya şifre hatalı.";
        return;
      }
      window.location.href = "dashboard.html";
    });

    // Zaten girişliyse doğrudan dashboard'a yönlendir.
    sb.auth.getSession().then(({ data }) => {
      if (data.session) window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
