<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fatura Edilmeyenler — Stok &amp; Cari</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="stock.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="admin-body" data-stock-page="unbilled">

  <div class="admin-topbar">
    <a href="stock-dashboard.html" class="brand">
      <img src="../logo.png" alt="Logo" style="height:36px;" />
      <span class="brand-text"><span class="brand-main" style="font-size:.9rem;">STOK &amp; CARİ</span></span>
    </a>
    <nav class="admin-topbar-nav">
      <a href="dashboard.html">← Admin Panel</a>
    </nav>
    <button class="admin-logout" id="logoutBtn">Çıkış Yap</button>
  </div>

  <div class="stock-shell">
    <aside class="stock-sidebar" id="stockSidebar"></aside>
    <main class="stock-content">
      <div class="stock-content-header">
        <div>
          <h2>Fatura Edilmeyenler</h2>
          <p>Normal stoktan ayrı — bedelsiz numune, deneme ve fatura bekleyen ürünler</p>
        </div>
        <div class="stock-content-actions">
          <button class="btn-small" id="newMovementBtn">+ Hareket Ekle</button>
        </div>
      </div>

      <div class="stock-stats">
        <div class="stock-stat-card">
          <div class="stock-stat-icon">◆</div>
          <div><div class="lbl">Kayıtlı Ürün</div><div class="num" id="statUnbilledProducts">—</div></div>
        </div>
        <div class="stock-stat-card">
          <div class="stock-stat-icon">Σ</div>
          <div><div class="lbl">Toplam Adet</div><div class="num" id="statUnbilledTotal">—</div></div>
        </div>
      </div>

      <div class="stock-table-wrap">
        <table class="stock-table">
          <thead>
            <tr><th>Kod</th><th>Ürün</th><th>Ambalaj</th><th class="num">Fatura Edilmeyen Stok</th><th class="num">Normal Stok</th></tr>
          </thead>
          <tbody id="unbilledBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <dialog id="movementDialog" class="stock-modal">
    <div class="stock-modal-head">
      <h3>Hareket Ekle</h3>
      <button type="button" onclick="closeDialog('movementDialog')">✕</button>
    </div>
    <div class="stock-modal-body">
      <div class="form-group">
        <label>Ürün</label>
        <select id="m_urun"></select>
      </div>
      <div class="stock-form-row">
        <div class="form-group">
          <label>Yön</label>
          <select id="m_yon">
            <option value="giris">Giriş (numune/deneme çıkışı stoğa eklenir)</option>
            <option value="cikis">Çıkış (fatura kesildi / iade edildi)</option>
          </select>
        </div>
        <div class="form-group"><label>Miktar</label><input type="number" id="m_miktar" value="1" /></div>
      </div>
      <div class="form-group"><label>Tarih</label><input type="date" id="m_tarih" /></div>
      <div class="form-group"><label>Açıklama</label><input type="text" id="m_aciklama" /></div>
      <div class="status-msg" id="movementStatusMsg"></div>
    </div>
    <div class="stock-modal-actions">
      <button type="button" class="btn-outline" onclick="closeDialog('movementDialog')">Vazgeç</button>
      <button type="button" class="btn-primary" id="saveMovementBtn">Kaydet</button>
    </div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="admin-auth.js"></script>
  <script src="stock-nav.js"></script>
  <script src="stock-common.js"></script>
  <script src="admin-stock-unbilled.js"></script>
</body>
</html>
