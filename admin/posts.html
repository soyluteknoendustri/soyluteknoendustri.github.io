<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Yazıları — Admin Panel</title>
  <link rel="icon" type="image/png" href="../logo.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css" rel="stylesheet" />
</head>
<body class="admin-body">

  <div class="admin-topbar">
    <a href="dashboard.html" class="brand">
      <img src="../logo.png" alt="Logo" style="height:36px;" />
      <span class="brand-text"><span class="brand-main" style="font-size:.9rem;">ADMIN PANEL</span></span>
    </a>
    <nav class="admin-topbar-nav">
      <a href="dashboard.html">Genel Bakış</a>
      <a href="posts.html" class="active">Blog Yazıları</a>
      <a href="products.html">Ürünler</a>
      <a href="settings.html">İletişim Bilgileri</a>
      <a href="../index.html" target="_blank">Siteyi Görüntüle ↗</a>
    </nav>
    <button class="admin-logout" id="logoutBtn">Çıkış Yap</button>
  </div>

  <main class="admin-main">
    <h2>Blog Yazıları</h2>
    <div class="admin-layout">

      <div class="admin-list">
        <div class="admin-list-header">
          <h3>Yazılar</h3>
          <button class="btn-small" id="newPostBtn">+ Yeni Yazı</button>
        </div>
        <div class="admin-list-items" id="postList"></div>
      </div>

      <div class="admin-form">
        <div class="lang-tabs">
          <button type="button" class="lang-tab active" data-lang="tr">Türkçe</button>
          <button type="button" class="lang-tab" data-lang="en">English</button>
        </div>

        <div class="lang-pane active" data-lang-pane="tr">
          <div class="form-group">
            <label>Başlık (TR)</label>
            <input type="text" id="titleTr" />
          </div>
          <div class="form-group">
            <label>Özet (TR)</label>
            <input type="text" id="excerptTr" />
          </div>
          <div class="form-group">
            <label>İçerik (TR)</label>
            <div class="editor-box"><div id="editorTr"></div></div>
          </div>
        </div>

        <div class="lang-pane" data-lang-pane="en">
          <div class="form-group">
            <label>Title (EN)</label>
            <input type="text" id="titleEn" />
          </div>
          <div class="form-group">
            <label>Excerpt (EN)</label>
            <input type="text" id="excerptEn" />
          </div>
          <div class="form-group">
            <label>Body (EN)</label>
            <div class="editor-box"><div id="editorEn"></div></div>
          </div>
        </div>

        <div class="admin-form-row">
          <div class="form-group">
            <label>Slug (URL)</label>
            <input type="text" id="slug" />
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;margin-top:20px;">
              <input type="checkbox" id="published" style="width:auto;" /> Yayınla
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Kapak Görseli</label>
          <div class="upload-row">
            <img id="coverPreview" class="upload-thumb" style="display:none;" />
            <input type="file" id="coverInput" accept="image/*" />
          </div>
        </div>

        <div class="form-group">
          <label>Ekler (PPT/PPTX/PDF) — önce yazıyı bir kez kaydedin</label>
          <div class="upload-row" id="attachmentList"></div>
          <input type="file" id="attachmentInput" accept=".ppt,.pptx,.pdf" disabled />
        </div>

        <div class="admin-form-actions">
          <button type="button" class="btn-primary" id="saveBtn">Kaydet</button>
          <button type="button" class="btn-danger" id="deleteBtn" style="display:none;">Sil</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/supabase-client.js"></script>
  <script src="admin-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
  <script src="admin-posts.js"></script>
</body>
</html>
